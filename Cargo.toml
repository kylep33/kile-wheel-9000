[workspace]
members = ["crates/core", "crates/platform", "crates/settings", "crates/wheel"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
kile-wheel-core = { path = "crates/core" }
kile-wheel-platform = { path = "crates/platform" }

anyhow = "1.0.104"
dirs = "7.0.0"
evdev = "0.13.2"
# async-io rather than the default tokio, so the tray does not pull in a second runtime
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2.190"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
# matches the version ksni brings, so the tray and the shell calls share one zbus
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }
tray-icon = "0.26.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cosmic-text = "0.19.0"
# tiny-skia comes through resvg's re-export, so the two can never disagree on its version
resvg = { version = "0.49.0", default-features = false }
eframe = "0.36.2"
egui = "0.36.2"
notify = "8.2.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# features unify across the workspace anyway, so they are declared once here
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
# win32 callbacks are everywhere here, so every unsafe op states its own scope
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
exhaustive_enums = "allow"
# line tables keep log backtraces readable without a full debug build
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false
