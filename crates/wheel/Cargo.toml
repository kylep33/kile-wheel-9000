[package]
name = "kile-wheel-9000"
description = "Radial app launcher for Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# the embedded manifest asks for elevation, so a test harness built from the bin could
# not be run; the tests live in the library instead
[[bin]]
name = "kile-wheel-9000"
path = "src/main.rs"
test = false

[dependencies]
anyhow.workspace = true
kile-wheel-core.workspace = true
kile-wheel-platform.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
windows.workspace = true
windows-numerics.workspace = true
