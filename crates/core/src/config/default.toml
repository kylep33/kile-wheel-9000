# kile-wheel-9000 config.
#
# Edit by hand or through the settings window; comments here survive either way.
# Paths may use environment variables, written the way this OS writes them.
# Icon paths are relative to this folder, so copying the folder moves your setup.

[general]
# managed by the installer, which adds or removes the login entry
start_with_windows = true
# ignore hotkeys while a fullscreen app has focus
disable_in_fullscreen = true
# activating the app that already has focus minimizes it, like the taskbar or dock
minimize_if_focused = true
show_clock = true

# Any number of hotkeys. action is "open", "close" or "toggle".
# Esc always closes the wheel and Backspace always backs out one level, so neither
# needs a binding here.
[[hotkeys]]
binding = "CapsLock"
action = "toggle"

# Modifiers are Ctrl, Alt, Shift and Win; Win is Super on Linux and Cmd on macOS.
# Binding a combo the desktop already uses takes it over.
# [[hotkeys]]
# binding = "Alt+Shift"
# action = "toggle"

# Mouse buttons bind too. XButton1 and XButton2 are usually browser back and forward.
# [[hotkeys]]
# binding = "XButton1"
# action = "toggle"

[wheel]
# "cursor" opens on the monitor under the pointer, "primary" always on the main one
monitor = "cursor"
# snap the cursor to the middle on open, on a tab change, and in and out of a sub-wheel
center_cursor = true
center_cursor_on_tab_change = true
center_cursor_on_sub_wheel = true
# "normal", "fast" or "off"
animation = "fast"
# whether the open hotkey also closes an already open wheel
open_hotkey_closes = false
size = 1.0
opacity = 1.0
accent = "#D8B36A"
empty_quips = [
    "FEED ME",
    "I'M HUNGRY",
    "*crickets*",
    "vacancy",
    "404: app not found",
    "room for rent",
    "insert app here",
]
# running apps that never take an unpinned slot, by executable name, for things like
# status bars
hidden_apps = ["komorebi-bar.exe"]

# Up to nine tabs, numbered 1 to 9 and selected with the number keys.
[[tabs]]
index = 1
name = "Main"

# Pinned entries. Each one claims a tab and a slot.
# Slots are numbered 0 at the top then clockwise, so 0 is N, 2 is E, 4 is S, 6 is W.
#
# Nothing appears on the wheel unless it is listed here. Running apps only land in slots
# you mark as "unpinned_app"; every other slot stays blank until you fill it.
#
# type = "unpinned_app"  a slot held open for whatever is running, filled by the wheel
# type = "app"           target = what starts the app (see the examples below)
# type = "script"        path + exec, where {path} is replaced with path
# type = "url"           url + optional browser and browser_args
# type = "snippet"       text, mode = "clipboard" or "type"
# type = "folder"        path, opened in the file manager
# type = "terminal"      optional cwd; on Windows also profile and distro
#
# Snippets are stored here as plain text, so keep secrets out of them.

# Four slots on tab 1 held open for whatever happens to be running:
#
# [[items]]
# type = "unpinned_app"
# name = "Open"
# tab = 1
# slot = 4
